name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: "pre-commit"

  build-wheels:
    needs: pre-commit
    name: Build wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.platform }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    needs: pre-commit
    name: Build sdist
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  smoke-test:
    name: Smoke test
    needs: build-wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/download-artifact@v4
        with:
          name: wheels-macos
          path: dist

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --find-links=dist --no-index --pre std-nslog
          python -c "
          import sys, io, nslog
          assert isinstance(sys.stdout, nslog.NSLogWriter)
          assert isinstance(sys.stderr, nslog.NSLogWriter)
          print('hello from std-nslog smoke test')
          print('this is stderr', file=sys.stderr)
          # nslog() should accept all log levels.
          nslog.nslog('explicit info', level=nslog.OS_LOG_TYPE_INFO)
          nslog.nslog('explicit error', level=nslog.OS_LOG_TYPE_ERROR)
          "
