name: CI
on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

# Cancel active CI runs for a PR before starting another run
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  FORCE_COLOR: "1"

jobs:
  pre-commit:
    name: Pre-commit checks
    uses: beeware/.github/.github/workflows/pre-commit-run.yml@main
    with:
      pre-commit-source: "pre-commit"

  build-wheels:
    needs: pre-commit
    name: Build wheels
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        with:
          output-dir: dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels
          path: ./dist/*.whl
          if-no-files-found: error

  build-sdist:
    needs: pre-commit
    name: Build sdist
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: ./dist/*.tar.gz
          if-no-files-found: error

  smoke-test:
    name: Smoke test (Python ${{ matrix.python-version }})
    needs: build-wheels
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["py310", "py311", "py312", "py313", "py314", "py315"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/download-artifact@v4
        with:
          name: wheels
          path: wheelhouse

      - name: Install tox
        run: |
          python -m pip install --group tox-uv

      - name: Run smoke test
        run: tox -e ${{ matrix.python-version }}
